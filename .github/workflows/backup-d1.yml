name: 🗄️ Backup D1 Database

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC = 06:00 Türkiye saati, her gün
  workflow_dispatch:

jobs:
  backup:
    name: 📦 Export and upload D1 backup
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: 🚚 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙ Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 11

      - name: ⚙ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "./mail-worker/pnpm-lock.yaml"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./mail-worker

      - name: 🐬 Export D1 database
        working-directory: ./mail-worker
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "BACKUP_FILE=email-$TIMESTAMP.sql" >> "$GITHUB_ENV"
          pnpm wrangler d1 export email --remote --output="email-$TIMESTAMP.sql"

      - name: ⬆️ Upload backup to R2
        working-directory: ./mail-worker
        run: |
          pnpm wrangler r2 object put "cloud-mail-backups/${{ env.BACKUP_FILE }}" --file="${{ env.BACKUP_FILE }}" --remote
